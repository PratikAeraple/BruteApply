name: bruteapply-production

# Private production topology. Public ingress is handled by Caddy after Access enforcement.
services:
  db:
    image: postgres:17.11-trixie@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    # Match the pinned official image's postgres UID/GID so the process does
    # not need root or retained capabilities to initialize its named volume.
    user: "999:999"
    environment:
      POSTGRES_DB: bruteapply
      POSTGRES_USER: bruteapply
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_password]
    group_add: ["1000"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bruteapply -d bruteapply]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.4.8-trixie@sha256:8966e8ff525ef9e3f3ea476cb15db868a41a701f5188c77c138e3ce613c2d81a
    # The pinned image's redis account owns the named volume; run it directly
    # as that account so no root entrypoint capability is needed.
    user: "999:999"
    command: [redis-server, --appendonly, "yes", --save, "60", "1000", --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 20s
      timeout: 4s
      retries: 3

  migrate:
    image: bruteapply-api:${BRUTEAPPLY_REVISION:?set full immutable source revision}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: [python, scripts/migrate.py]
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    group_add: ["1000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  api:
    image: bruteapply-api:${BRUTEAPPLY_REVISION:?set full immutable source revision}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment: &application_environment
      APP_ENV: production
      DEMO_MODE: "false"
      OWNER_EMAIL: ${BRUTEAPPLY_OWNER_EMAIL:?set exact Access owner email}
      CF_ACCESS_ISSUER: ${BRUTEAPPLY_ACCESS_ISSUER:?set exact Access issuer}
      CF_ACCESS_AUD: ${BRUTEAPPLY_ACCESS_AUDIENCE:?set exact Access audience}
      DATABASE_URL_FILE: /run/secrets/database_url
      DOCUMENT_ENCRYPTION_KEY_FILE: /run/secrets/document_encryption_key
      DOCUMENT_ROOT: /var/lib/bruteapply/documents
      REDIS_URL: redis://redis:6379/0
      TIMEZONE: America/Toronto
      AUTONOMOUS_SUBMISSION_ENABLED: "false"
      SOURCE_REVISION: ${BRUTEAPPLY_REVISION:?set full immutable source revision}
    secrets: [database_url, document_encryption_key]
    group_add: ["1000"]
    volumes: [documents:/var/lib/bruteapply/documents]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [application, data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: bruteapply-api:${BRUTEAPPLY_REVISION:?set full immutable source revision}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: [celery, -A, app.tasks.celery_app, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    environment:
      <<: *application_environment
    secrets: [database_url, document_encryption_key]
    group_add: ["1000"]
    volumes: [documents:/var/lib/bruteapply/documents]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data, discovery_egress]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.tasks.celery_app inspect ping --destination="worker@$$HOSTNAME" --timeout=3 2>/dev/null | grep -q pong']
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

  scheduler:
    image: bruteapply-api:${BRUTEAPPLY_REVISION:?set full immutable source revision}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: [celery, -A, app.tasks.celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      TZ: America/Toronto
    depends_on:
      redis:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, "python -c 'from pathlib import Path; c=Path(\"/proc/1/task/1/children\").read_text().split(); assert any(b\"celery\" in (d:=Path(f\"/proc/{p}/cmdline\").read_bytes()) and b\"beat\" in d for p in c)' "]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s

  private-resume-bootstrap:
    profiles: [bootstrap]
    image: bruteapply-api:${BRUTEAPPLY_REVISION:?set full immutable source revision}
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: [python, scripts/import_private_resume.py, --source-dir, /run/bruteapply-bootstrap]
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DOCUMENT_ENCRYPTION_KEY_FILE: /run/secrets/document_encryption_key
      DOCUMENT_ROOT: /var/lib/bruteapply/documents
    secrets: [database_url, document_encryption_key]
    group_add: ["1000"]
    volumes:
      - documents:/var/lib/bruteapply/documents
      - type: bind
        source: ${BRUTEAPPLY_BOOTSTRAP_DIR:?set owner-only encrypted bootstrap directory}
        target: /run/bruteapply-bootstrap
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "no"
    mem_limit: 512m
    cpus: 0.5

  web:
    image: bruteapply-web:${BRUTEAPPLY_REVISION:?set full immutable source revision}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_MODE: production
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      application:
        aliases: [bruteapply-web]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  application:
    internal: true
  data:
    internal: true
  # Only the public ATS discovery worker joins this outbound-only bridge.
  # Its provider client is pinned to public Greenhouse/Lever HTTPS origins,
  # rejects redirects, and never follows posting URLs.
  discovery_egress:
    name: bruteapply-production_discovery_egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  postgres_data:
    name: bruteapply-postgres-data
  redis_data:
    name: bruteapply-redis-data
  documents:
    name: bruteapply-private-documents

secrets:
  postgres_password:
    file: ${BRUTEAPPLY_SECRET_DIR:?set protected secret directory}/postgres-password
  database_url:
    file: ${BRUTEAPPLY_SECRET_DIR:?set protected secret directory}/database-url
  document_encryption_key:
    file: ${BRUTEAPPLY_SECRET_DIR:?set protected secret directory}/document-encryption-key
