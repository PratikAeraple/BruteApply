name: bruteapply-demo

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      OWNER_EMAIL: owner@example.invalid
      DOCUMENT_ROOT: /var/lib/bruteapply/documents
      AUTONOMOUS_SUBMISSION_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s
    networks: [demo]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
    networks: [demo]

networks:
  demo:
    internal: true
